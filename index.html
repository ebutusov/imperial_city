<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suijō Market Canal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<!-- Linked here (not imported from JS) so it applies before the first paint. Vite still processes and bundles it. -->
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<div id="stage">
  <canvas id="c" tabindex="0" aria-label="3D canal market scene. Drag to look around, WASD to fly."></canvas>
  <div class="panel" id="panel">
    <h1>Suijō Market Canal <span>水上市場</span></h1>
    <dl class="keys" id="keys">
      <dt>Mouse</dt><dd>Drag to look. Click the scene to lock the pointer, Esc to release.</dd>
      <dt>W A S D</dt><dd>Fly forward, left, back, right</dd>
      <dt>Space / Q</dt><dd>Up / down. Hold Shift to go faster.</dd>
      <dt>Touch</dt><dd>Drag right side to look, left side to move</dd>
    </dl>
    <div class="row">
      <button id="reset" type="button">Reset view</button>
      <button id="hide" type="button">Hide help</button>
    </div>
  </div>
  <div id="msg" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span>Building the canal…</span></div>
</div>
<!-- Vite entry point. In development it is served as native ES modules; `npm run build` bundles it. -->
<script type="module" src="/src/main.js"></script>
</body>
</html>
